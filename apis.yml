name: United Dwelling
description: United Dwelling was a Los Angeles-based real estate development company
  founded in 2018 by venture capitalist Steven Dietz to address the affordable housing
  shortage by converting underused garages and backyards into accessory dwelling units
  (ADUs). The company offered studio, one-bedroom, and two-bedroom zero-net-carbon
  units ranging from 328 to 647 square feet and handled permitting, construction,
  financing, and property management end to end. It raised a $10 million Series B
  in May 2020 led by Alpha Edison with participation from Lightspeed Venture Partners.
  The business appears to have wound down - its website has lapsed (Squarespace account
  expired) and its Los Angeles location is marked closed as of mid-2026 - and it publishes
  no public API or developer program.
